name: Real data (state Medicaid PDLs)

# Every morning, and on demand: downloads the public PDLs in sources/medicaid_pdls.yaml, extracts
# them with the same pipeline as the synthetic corpus, prints the results and an audit sample, and
# keeps them as an artifact. Nothing downloaded is committed.
on:
  schedule:
    - cron: "41 6 * * *"  # 06:41 UTC, with the defaults below
  workflow_dispatch:
    inputs:
      states:
        description: "Comma-separated state codes to fetch (blank: every source)"
        required: false
        default: ""
      audit:
        description: "Accepted rows to print beside their source line for checking"
        required: false
        default: "60"
      llm:
        description: "Read prose pages with an LLM (needs the ANTHROPIC_API_KEY secret and PDLWATCH_MODEL variable)"
        type: boolean
        default: false
      keep_pdfs:
        description: "Also keep the downloaded PDFs as an artifact for 7 days, to check rows against the pages"
        type: boolean
        default: false
      inspect:
        description: "Pages to print as the parser reads them: part of a file name and pages, e.g. INM-SUPDL:52,57 NYRx:33"
        required: false
        default: ""

# one run at a time: each starts from the archive the last successful run kept
concurrency:
  group: real-data
  cancel-in-progress: false

permissions:
  contents: read
  actions: read  # to download the archive an earlier run kept

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PDLWATCH_DB: data/real/pdlwatch.duckdb
      PDLWATCH_RXNORM: data/real/cache/rxnorm.json
      PDLWATCH_PROVIDER: ${{ inputs.llm && 'anthropic' || 'mock' }}
      PDLWATCH_MODEL: ${{ vars.PDLWATCH_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STATES: ${{ inputs.states }}
      AUDIT_ROWS: ${{ inputs.audit }}
      USE_LLM: ${{ inputs.llm }}
    steps:
      - uses: actions/checkout@v4
      - name: OCR engine
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --extra llm --extra dev
      # the PDF archive, ledger and extraction cache carry over from the last successful run, which
      # keeps them as an artifact for 90 days: a run downloads only files that changed and extracts
      # only new versions
      - name: Restore the archive from the last successful run
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run=$(gh run list --workflow real-data.yml --branch main --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run" ] && gh run download "$run" --name real-data-archive --dir data/real; then
            echo "Restored the archive kept by run $run"
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No archive kept by an earlier successful run"
          fi
      # runs before 26 October 2026 kept the archive in the Actions cache
      - name: Restore an older archive from the cache
        if: steps.archive.outputs.restored != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/real/pdfs
            data/real/ledger.jsonl
            data/real/cache
          key: real-data-
          restore-keys: real-data-
      # drug names the dictionary doesn't know are read against RxNorm (NLM's monthly
      # prescribable release: free, no license); without it they go to review
      - name: RxNorm names
        run: |
          .venv/bin/python -m pdlwatch.cli rxnorm --out "$PDLWATCH_RXNORM" \
            || echo "::warning::RxNorm release unavailable; names outside the dictionary go to review"
      - name: Sync and extract
        run: |
          args=()
          if [ -n "$STATES" ]; then args+=(--states "$STATES"); fi
          if [ "$USE_LLM" = "true" ]; then args+=(--llm); fi
          .venv/bin/python -m pdlwatch.cli sync "${args[@]}"
      - name: Results
        run: |
          echo "::group::results.json"
          cat data/real/results.json
          echo "::endgroup::"
          .venv/bin/python -m pdlwatch.cli sql "SELECT doc_id, state, doc_type, effective, pages, ocr_pages, rows, accepted, review FROM documents ORDER BY state, effective, doc_id"
          .venv/bin/python -m pdlwatch.cli query state_scorecard
          .venv/bin/python -m pdlwatch.cli sql "SELECT state, change, COUNT(*) AS n FROM changes GROUP BY state, change ORDER BY state, change"
      - name: What waits for review
        run: |
          .venv/bin/python -m pdlwatch.cli sql "SELECT state, review_reasons, drug_text FROM review_queue ORDER BY random() LIMIT 60"
      - name: Audit sample
        run: |
          n="${AUDIT_ROWS:-60}"
          case "$n" in ''|*[!0-9]*) n=60 ;; esac
          .venv/bin/python -m pdlwatch.cli audit -n "$n" --pdfs data/real/pdfs
      - name: Inspect pages
        if: inputs.inspect != ''
        env:
          INSPECT: ${{ inputs.inspect }}
        run: |
          for spec in $INSPECT; do
            part="${spec%%:*}"; pages="${spec#*:}"
            case "$pages" in ''|*[!0-9,]*) echo "skipping $spec: pages must be numbers"; continue ;; esac
            for f in data/real/pdfs/*.pdf data/real/pdfs/*.xlsx data/real/pdfs/*.csv; do
              [ -e "$f" ] || continue
              case "$(basename "$f")" in
                *"$part"*) .venv/bin/python -m pdlwatch.cli inspect "$f" --pages "$pages" --width 120 ;;
              esac
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: real-data-results
          path: |
            data/real/results.json
            data/real/manifest.json
            data/real/ledger.jsonl
      - name: Keep the archive for the next run
        uses: actions/upload-artifact@v4
        with:
          name: real-data-archive
          path: |
            data/real/pdfs
            data/real/ledger.jsonl
            data/real/cache
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: inputs.keep_pdfs
        with:
          name: real-data-pdfs
          path: data/real/pdfs
          retention-days: 7
