- state: WA
  title: Washington Apple Health PDL, weekly versions (Excel)
  page: https://www.hca.wa.gov/billers-providers-partners/program-information-providers/apple-health-preferred-drug-list-pdl
  match: "(?i)apple-health-pdl-20[0-9]{6}"  # one dated workbook per week; the PDF is from 2020
  newest_first: true
  max: 2
  # one row per package (NDC) in 23 coded columns: the drugs on the PDL (AHPDL inclusion Y),
  # with the pharmacy benefit's status (P / N) and PA (Y / N); the medical benefit's are left
  profile:
    columns:
      APPLE HEALTH DRUG CLASS: Drug Class
      LABEL NAME: Drug Name
      PHARMACY PREFERRED STATUS: Preferred Status
      PHARMACY PA STATUS: PA Status
    rows:
      AHPDL INCLUSION: "Y"

- state: WV
  title: West Virginia Medicaid PDL page
  page: https://bms.wv.gov/preferred-drug-list-and-coverage-details
  match: "(?i)^(?!.*frequently asked).*(preferred drug list|pdl)"  # the list, not its FAQ
  newest_first: true  # the page lists older versions first
  max: 1
