# Public Medicaid preferred drug lists (PDLs) and formularies, by state.
#
# Each entry is either
#   url:   a direct link to one PDF (or Excel/CSV file), or
#   page:  a public web page; its file links whose address or link text match `match` are
#          downloaded (up to `max`, in page order, or the newest-looking first with
#          `newest_first: true`). State sites rename files every quarter, so a page is often
#          the more stable address.
# A spreadsheet the parser can't read as it is takes a `profile`: `columns` to keep, renamed to
# header words the parser knows, and `rows` to keep (a column and the value it must hold). The
# rest is dropped and repeated rows collapse into one. `pdlwatch inspect FILE --pages 1` lists
# each column's values to write one from.
#
# `fetch` sends one request per second, identifies itself, honours robots.txt, and skips (and
# reports) anything that fails. Links go stale as states publish new versions: a failed entry is
# a prompt to update this file, not an error in the pipeline. Collected October 2026.

